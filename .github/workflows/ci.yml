name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install glslangValidator
        run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - run: pnpm install --frozen-lockfile
      - name: pnpm check
        run: pnpm check
        env:
          XT_REQUIRE_GLSLANG: '1'
      - run: pnpm release:dry
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            artifacts/size.json
            artifacts/*.tgz

  browser:
    name: GPU tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: xvfb-run -a pnpm test:browser
        env:
          XT_BROWSERS: ${{ matrix.browser }}
          XT_HEADED: ${{ matrix.browser == 'firefox' && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .cache/holocss
          key: holocss-${{ hashFiles('holocss.json') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - name: Upload the built site as a preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/.vitepress/dist
