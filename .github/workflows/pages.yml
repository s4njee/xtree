name: Pages

# Builds the documentation site and deploys it to GitHub Pages whenever the
# default branch changes. Run it by hand from the Actions tab to redeploy.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/cache@v4
        with:
          path: .cache/holocss
          key: holocss-${{ hashFiles('holocss.json') }}
      - run: pnpm install --frozen-lockfile
      - name: Build the site
        run: pnpm docs:build
        env:
          XT_DOCS_BASE: ${{ steps.pages.outputs.base_path }}/
          XT_DOCS_ORIGIN: ${{ steps.pages.outputs.origin }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
